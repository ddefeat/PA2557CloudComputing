apiVersion: v1
kind: Service
metadata:
  name: chess-db
  labels:
    app: chess-db

spec:
  ports:
    - port: 5432
      targetPort: postgres-port

  selector:
    app: chess-db

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chess-db
  labels:
    app: chess-db

spec:
  serviceName: chess-db
  replicas: 1

  selector:
    matchLabels:
      app: chess-db

  template:
    metadata:
      labels:
        app: chess-db

    spec:
      containers:
        - name: chess-db
          image: hugo421/chess-db:latest

          ports:
            - containerPort: 5432
              name: postgres-port

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

            - name: POSTGRES_DB
              value: chess

          volumeMounts:
            - name: chess-db-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: chess-db-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      nodePort: 30001
  selector:
    app: frontend

---

apiVersion: v1
kind: Service
metadata:
  name: opening-service
  labels:
    app: opening-service
spec:
  ports:
    - port: 8000
  selector:
    app: opening-service

---

apiVersion: v1
kind: Service
metadata:
  name: game-service
  labels:
    app: game-service
spec:
  ports:
    - port: 8001
  selector:
    app: game-service

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hugo421/chess-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opening-service
  labels:
    app: opening-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opening-service
  template:
    metadata:
      labels:
        app: opening-service
    spec:
      containers:
        - name: opening-service
          image: hugo421/opening-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  labels:
    app: game-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
    spec:
      containers:
        - name: game-service
          image: hugo421/game-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
