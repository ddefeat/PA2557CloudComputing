apiVersion: v1
kind: Service
metadata:
  name: chess-db
  labels:
    app: chess-db

spec:
  ports:
    - port: 5432
      targetPort: postgres-port

  selector:
    app: chess-db

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chess-db
  labels:
    app: chess-db

spec:
  serviceName: chess-db
  replicas: 1

  selector:
    matchLabels:
      app: chess-db

  template:
    metadata:
      labels:
        app: chess-db

    spec:
      containers:
        - name: chess-db
          image: litebertia/chess-db:latest

          ports:
            - containerPort: 5432
              name: postgres-port

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

            - name: POSTGRES_DB
              value: chess

          volumeMounts:
            - name: chess-db-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: chess-db-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
